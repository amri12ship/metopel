name: keep-warm

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping production
        run: |
          code=$(curl -m 60 -s -o /dev/null -w '%{http_code}' https://metopel.vercel.app/)
          echo "HTTP $code"
          [ "$code" -ge 500 ] && exit 1