name: keep-warm

on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping production
        run: |
          failed=0
          for url in \
            'https://metopel.vercel.app/' \
            'https://metopel-amri9.vercel.app/'; do

            ok=""
            code=""
            ms=""
            for attempt in 1 2; do
              start=$(date +%s%3N)
              code=$(curl -m 40 -sS -o /dev/null -w '%{http_code}' "$url" 2>/dev/null)
              rc=$?
              end=$(date +%s%3N)
              ms=$((end - start))
              if [ "$code" = "200" ]; then
                ok="true"
                break
              fi
              echo "retry attempt $attempt for $url (rc=$rc code=${code:-none})"
              sleep 3
            done

            if [ "$ok" = "true" ]; then
              echo "OK   $url  HTTP $code  ${ms}ms"
            else
              echo "FAIL $url  last HTTP ${code:-none}  rc=$rc"
              failed=1
            fi
          done

          [ "$failed" -ne 0 ] && exit 1